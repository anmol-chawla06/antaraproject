<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antara Admin | Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-bg-primary: #111111;
            --clr-bg-surface: #1A1A1A;
            --clr-text-primary: #ECE9E1;
            --clr-text-secondary: #99958C;
            --clr-border: rgba(236, 233, 225, 0.12);
            --clr-accent: #C49F74;
            --clr-new: #4299E1;
            --clr-read: #99958C;
            --clr-replied: #48BB78;
            --clr-archived: #E53E3E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--clr-bg-primary); color: var(--clr-text-primary); display: flex; height: 100vh; overflow: hidden; }
        h1, h2, h3 { font-family: 'Lora', serif; font-weight: normal; }
        
        .sidebar { width: 350px; border-right: 1px solid var(--clr-border); display: flex; flex-direction: column; background: var(--clr-bg-surface); }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--clr-border); }
        .message-list { flex: 1; overflow-y: auto; }
        .message-item { padding: 1.5rem; border-bottom: 1px solid var(--clr-border); cursor: pointer; transition: background 0.2s; }
        .message-item:hover { background: rgba(255,255,255,0.02); }
        .message-item.active { background: rgba(255,255,255,0.05); border-left: 3px solid var(--clr-accent); }
        .msg-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--clr-text-secondary); margin-bottom: 0.5rem; }
        .msg-name { font-weight: 500; color: var(--clr-text-primary); margin-bottom: 0.25rem; }
        .msg-subject { font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--clr-text-secondary); }
        .msg-preview { font-size: 0.85rem; color: var(--clr-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-new { background: var(--clr-new); }
        .status-read { background: var(--clr-read); }
        .status-replied { background: var(--clr-replied); }
        .status-archived { background: var(--clr-archived); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 3rem; }
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--clr-text-secondary); font-style: italic; }
        
        .detail-view { display: none; max-width: 800px; }
        .detail-header { border-bottom: 1px solid var(--clr-border); padding-bottom: 2rem; margin-bottom: 2rem; }
        .detail-name { font-size: 2rem; margin-bottom: 0.5rem; }
        .detail-meta { color: var(--clr-text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .detail-actions { display: flex; gap: 1rem; }
        
        .btn { background: transparent; border: 1px solid var(--clr-border); color: var(--clr-text-primary); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn:hover { border-color: var(--clr-text-primary); }
        .btn-reply { border-color: var(--clr-accent); color: var(--clr-accent); }
        .btn-reply:hover { background: var(--clr-accent); color: var(--clr-bg-primary); }
        
        .detail-body { font-size: 1.05rem; line-height: 1.6; color: var(--clr-text-primary); white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Contact Messages</h2>
            <p style="font-size: 0.8rem; color: var(--clr-text-secondary); margin-top: 5px;">Antara Admin</p>
        </div>
        <div class="message-list" id="messageList">
            <div style="padding: 1.5rem; color: var(--clr-text-secondary); text-align: center;">Loading...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="empty-state" id="emptyState">
            Select a message to view
        </div>
        
        <div class="detail-view" id="detailView">
            <div class="detail-header">
                <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1 class="detail-name" id="detName">Name</h1>
                        <div class="detail-meta">
                            <span id="detEmail">email@example.com</span> &bull; 
                            <span id="detDate">Date</span> &bull; 
                            <span id="detStatusLabel">Status</span>
                        </div>
                    </div>
                </div>
                <div class="detail-actions">
                    <a href="#" class="btn btn-reply" id="btnReply">Reply via Email</a>
                    <button class="btn" onclick="updateStatus('read')">Mark as Read</button>
                    <button class="btn" onclick="updateStatus('replied')">Mark as Replied</button>
                    <button class="btn" onclick="updateStatus('archived')">Archive</button>
                </div>
            </div>
            
            <div class="detail-body">
                <h3 style="margin-bottom: 1rem; font-family: 'Inter', sans-serif; font-size: 1.1rem; color: var(--clr-text-secondary);" id="detSubject">Subject</h3>
                <div id="detMessage">Message body goes here...</div>
            </div>
        </div>
    </div>

    <script>
        let currentMessages = [];
        let activeMessageId = null;

        function showListNotice(text, isError) {
            const list = document.getElementById('messageList');
            list.textContent = '';
            const box = document.createElement('div');
            box.style.padding = '1.5rem';
            box.style.textAlign = 'center';
            box.style.color = isError ? 'var(--clr-error, #c0392b)' : 'var(--clr-text-secondary)';
            box.textContent = text;
            list.appendChild(box);
        }

        async function fetchMessages() {
            try {
                const res = await fetch('/api/contact/messages');
                if (res.status === 401) {
                    window.location.href = '/admin-login.html';
                    return;
                }
                const payload = await res.json();
                if (!res.ok || !payload.success) {
                    showListNotice((payload.error && payload.error.message) || 'Failed to load messages.', true);
                    return;
                }
                currentMessages = payload.data.messages || [];
                renderList();
            } catch (err) {
                showListNotice('Failed to load messages.', true);
            }
        }

        // Message fields come from a public form, so every value is built as a
        // text node. Interpolating them into innerHTML would be stored XSS.
        function renderList() {
            const list = document.getElementById('messageList');
            list.textContent = '';

            if (currentMessages.length === 0) {
                showListNotice('No messages.', false);
                return;
            }

            currentMessages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'message-item' + (msg.id === activeMessageId ? ' active' : '');
                item.addEventListener('click', () => selectMessage(msg.id));

                const meta = document.createElement('div');
                meta.className = 'msg-meta';

                const statusSpan = document.createElement('span');
                const dot = document.createElement('span');
                dot.className = 'status-dot status-' + msg.status;
                statusSpan.appendChild(dot);
                statusSpan.appendChild(document.createTextNode(String(msg.status).toUpperCase()));

                const dateSpan = document.createElement('span');
                dateSpan.textContent = new Date(msg.created_at).toLocaleDateString();

                meta.appendChild(statusSpan);
                meta.appendChild(dateSpan);
                item.appendChild(meta);

                [['msg-name', msg.name], ['msg-subject', msg.subject], ['msg-preview', msg.message]]
                    .forEach(([cls, value]) => {
                        const el = document.createElement('div');
                        el.className = cls;
                        el.textContent = value || '';
                        item.appendChild(el);
                    });

                list.appendChild(item);
            });
        }

        function selectMessage(id) {
            activeMessageId = id;
            renderList();
            
            const msg = currentMessages.find(m => m.id === id);
            if (!msg) return;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';

            document.getElementById('detName').textContent = msg.name;
            document.getElementById('detEmail').textContent = msg.email;
            document.getElementById('detDate').textContent = new Date(msg.created_at).toLocaleString();
            document.getElementById('detStatusLabel').textContent = 'Status: ' + msg.status.toUpperCase();
            document.getElementById('detSubject').textContent = msg.subject || 'No Subject';
            document.getElementById('detMessage').textContent = msg.message;
            
            document.getElementById('btnReply').href = `mailto:${msg.email}?subject=Re: ${encodeURIComponent(msg.subject || 'Your message to Antara')}`;

            // Auto-mark as read if new
            if (msg.status === 'new') {
                updateStatus('read');
            }
        }

        async function updateStatus(status) {
            if (!activeMessageId) return;
            try {
                const res = await fetch(`/api/contact/messages/${activeMessageId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (res.status === 401) {
                    window.location.href = '/admin-login.html';
                    return;
                }
                if (res.ok) {
                    const idx = currentMessages.findIndex(m => m.id === activeMessageId);
                    if (idx > -1) {
                        currentMessages[idx].status = status;
                        renderList();
                        document.getElementById('detStatusLabel').textContent = 'Status: ' + status.toUpperCase();
                    }
                }
            } catch (err) {
                console.error("Failed to update status");
            }
        }

        // Init
        fetchMessages();
    </script>
</body>
</html>
