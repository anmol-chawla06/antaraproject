<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antara | Cultural Heritage Grid</title>
  
  <!-- Immediate Theme Application to prevent theme flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('antara_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    /* Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap');

    :root {
      /* Dark Cosmic Palette (Default) */
      --bg-primary: #070509;
      --bg-secondary: rgba(18, 13, 26, 0.75);
      --bg-panel-left: rgba(7, 5, 9, 0.65);
      --bg-panel-right: rgba(7, 5, 9, 0.75);
      --bg-card: rgba(18, 13, 26, 0.65);
      --bg-card-hover: rgba(223, 183, 67, 0.12);
      --bg-overlay: radial-gradient(circle at 30% 50%, rgba(7, 5, 9, 0.85) 0%, rgba(7, 5, 9, 0.98) 100%);
      
      --text-primary: #e2dfeb;
      --text-secondary: #a39eb8;
      --text-muted: #847e99;
      
      --accent-gold: #dfb743;
      --accent-gold-light: #fcf6ba;
      --accent-gold-dark: #bf953f;
      
      --border-color: rgba(223, 183, 67, 0.2);
      --border-color-strong: rgba(223, 183, 67, 0.4);
      --shadow-main: rgba(0, 0, 0, 0.6);
      --btn-bg: linear-gradient(135deg, rgba(18, 13, 26, 0.9), rgba(7, 5, 9, 0.9));

      --font-display: 'Cinzel', serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Montserrat', sans-serif;
      --font-sanskrit: 'Noto Serif Devanagari', 'Cormorant Garamond', serif;
    }

    [data-theme="light"] {
      /* Refined Warm Ivory / Heritage Light Palette */
      --bg-primary: #FDFBF7;
      --bg-secondary: rgba(245, 240, 230, 0.85);
      --bg-panel-left: rgba(253, 251, 247, 0.78);
      --bg-panel-right: rgba(253, 251, 247, 0.88);
      --bg-card: rgba(255, 255, 255, 0.82);
      --bg-card-hover: rgba(184, 141, 51, 0.12);
      --bg-overlay: radial-gradient(circle at 30% 50%, rgba(253, 251, 247, 0.88) 0%, rgba(245, 240, 230, 0.96) 100%);
      
      --text-primary: #1C1921;
      --text-secondary: #4A4453;
      --text-muted: #6C6677;
      
      --accent-gold: #9B7829;
      --accent-gold-light: #C89D3C;
      --accent-gold-dark: #7A5C1B;
      
      --border-color: rgba(155, 120, 41, 0.25);
      --border-color-strong: rgba(155, 120, 41, 0.45);
      --shadow-main: rgba(80, 60, 30, 0.12);
      --btn-bg: linear-gradient(135deg, #FAF7F0, #EDE4D3);
    }

    * { 
      box-sizing: border-box; 
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: var(--bg-primary) url('./images/temple.png') center/cover no-repeat fixed;
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden; 
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ambient Overlay */
    .bg-overlay {
      position: absolute; inset: 0;
      background: var(--bg-overlay);
      z-index: 1;
      transition: background 0.3s ease;
    }

    /* Architecture */
    .split-layout {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 40% Left Panel */
    .panel-left {
      width: 40%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      background: var(--bg-panel-left);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .temporal-header {
      padding: 2.2rem 2.2rem 1.2rem;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 2.8vw, 2.6rem);
      background: linear-gradient(to right, var(--accent-gold-light), var(--accent-gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 5px;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--accent-gold);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin: 6px 0 0;
      font-weight: 500;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color-strong);
      color: var(--accent-gold);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      flex-shrink: 0;
      box-shadow: 0 2px 8px var(--shadow-main);
      outline: none;
    }
    .theme-toggle-btn:hover {
      border-color: var(--accent-gold);
      background: var(--bg-card-hover);
      color: var(--accent-gold-light);
      transform: scale(1.08);
      box-shadow: 0 4px 14px var(--shadow-main);
    }

    /* Sanskrit Shlok Presentation */
    .shlok-container {
      margin-top: 1.2rem;
      padding: 0.85rem 1.1rem;
      border-left: 2.5px solid var(--accent-gold);
      background: var(--bg-card);
      border-radius: 0 8px 8px 0;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: all 0.3s ease;
    }

    .shlok-text {
      font-family: var(--font-sanskrit);
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-gold);
      line-height: 1.35;
    }

    .shlok-trans {
      font-family: var(--font-serif);
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.35;
    }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.9rem;
      padding: 0 2.2rem;
      flex-shrink: 0;
    }

    .month-node {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1.1rem 0;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      font-family: var(--font-display);
      color: var(--text-secondary);
      letter-spacing: 2px;
      box-shadow: inset 0 0 10px var(--shadow-main);
    }
    .month-node:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold);
      color: var(--accent-gold-light);
    }
    .month-node.active {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 16px var(--border-color), inset 0 0 10px var(--border-color);
    }
    
    /* Festival Indicator */
    .festival-indicator {
      position: absolute;
      top: 6px; right: 8px;
      font-size: 0.75rem;
      color: var(--accent-gold);
      text-shadow: 0 0 5px var(--accent-gold-light);
    }

    /* Carousel */
    .carousel-container {
      flex-grow: 1;
      margin: 1.8rem 2.2rem 2.2rem;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color-strong);
      box-shadow: 0 15px 35px var(--shadow-main);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .carousel-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .carousel-img.active {
      opacity: 1;
    }

    /* 60% Right Panel */
    .panel-right {
      width: 60%;
      padding: 3.5rem 4.5rem;
      overflow-y: auto;
      background: var(--bg-panel-right);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      transition: background 0.3s ease;
    }
    
    /* Scrollbar */
    .panel-right::-webkit-scrollbar { width: 6px; }
    .panel-right::-webkit-scrollbar-track { background: transparent; }
    .panel-right::-webkit-scrollbar-thumb { background: var(--border-color-strong); border-radius: 3px; }

    /* Content Area with Transition */
    .content-layer {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .content-layer.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Festival Hero Image */
    .festival-hero-img-container {
      width: 100%;
      height: 280px;
      margin-bottom: 2.2rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color-strong);
      box-shadow: 0 10px 30px var(--shadow-main);
    }
    .festival-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--accent-gold);
      opacity: 0.75;
      font-family: var(--font-display);
    }
    .empty-state .symbol { font-size: 3rem; margin-bottom: 1rem; }

    .heritage-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      margin: 0 0 1rem;
      line-height: 1.15;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }

    .heritage-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
    }
    .meta-tag {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2.5rem 0 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .section-title::before { content: '◈'; font-size: 0.9rem; }
    .section-title::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-color-strong), transparent);
    }

    .heritage-text {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      line-height: 1.8;
      color: var(--text-primary);
      margin-bottom: 2rem;
      transition: color 0.3s ease;
    }

    .action-container {
      margin-top: 3.5rem;
      padding-top: 2.5rem;
      border-top: 1px dashed var(--border-color-strong);
    }

    .plan-trip-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--btn-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 1.1rem 2.8rem;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--shadow-main);
      transition: all 0.3s ease;
    }
    .plan-trip-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold-light);
      color: var(--accent-gold-light);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px var(--shadow-main), 0 0 20px var(--border-color-strong);
    }
    
    .list-picker {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
    }
    
    .state-group {
      margin-bottom: 2rem;
    }
    .state-group-header {
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .state-group-header::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-color-strong), transparent);
    }
    
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    .event-card:hover {
      border-color: var(--accent-gold);
      background: var(--bg-card-hover);
      transform: translateX(4px);
      box-shadow: 0 4px 15px var(--shadow-main);
    }
    .event-info {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .event-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    .event-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .explore-btn {
      background: var(--btn-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 0.6rem 1.4rem;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      margin-left: 1rem;
    }
    .explore-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-gold-light);
      color: var(--accent-gold-light);
      box-shadow: 0 0 12px var(--border-color-strong);
    }

    /* Responsive */
    @media (max-width: 1000px) {
      .split-layout { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
      body, html { overflow: auto; }
      .panel-left, .panel-right { width: 100%; border: none; }
      .panel-left { border-bottom: 1px solid var(--border-color); }
      .carousel-container { height: 280px; }
      .panel-right { padding: 3rem 2rem; }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  
  <div class="split-layout" id="festival-section">

    <!-- LEFT PANEL: Temporal Core -->
    <div class="panel-left">
      <div class="temporal-header">
        <div class="header-top-row">
          <div>
            <a href="landing-page/index.html" style="text-decoration:none;color:inherit;">
              <h1 class="brand-title">Antara</h1>
            </a>
            <p class="brand-subtitle">The Temporal Grid</p>
          </div>
          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light or dark theme" title="Switch Theme">
            <span class="theme-icon">☀</span>
          </button>
        </div>
        
        <!-- Sanskrit Shlok & Translation -->
        <div class="shlok-container">
          <div class="shlok-text">“उत्सवप्रियाः खलु मनुष्याः”</div>
          <div class="shlok-trans">Humans are naturally fond of festivals and celebrations</div>
        </div>
      </div>
      
      <!-- Calendar Grid -->
      <div class="calendar-grid" id="calendar">
        <!-- Generated by JS -->
      </div>
      
      <!-- Rotating Carousel -->
      <div class="carousel-container" id="carousel">
        <!-- Generated by JS -->
      </div>
    </div>
    
    <!-- RIGHT PANEL: Heritage Details -->
    <div class="panel-right" id="heritage-panel">
      
      <div class="empty-state" id="empty-state">
        <div class="symbol">❖</div>
        <div>Select a temporal node to reveal its cultural heritage</div>
      </div>

      <div class="content-layer" id="content-layer" style="display: none;">
        <!-- Injected dynamically -->
      </div>
      
    </div>
  </div>

  <script>
    // --- State & Config ---
    let allFestivals = [];
    let currentCarouselIndex = 0;
    let carouselInterval;
    
    const months = [
      { code: "JAN", name: "January" },
      { code: "FEB", name: "February" },
      { code: "MAR", name: "March" },
      { code: "APR", name: "April" },
      { code: "MAY", name: "May" },
      { code: "JUN", name: "June" },
      { code: "JUL", name: "July" },
      { code: "AUG", name: "August" },
      { code: "SEP", name: "September" },
      { code: "OCT", name: "October" },
      { code: "NOV", name: "November" },
      { code: "DEC", name: "December" }
    ];

    // --- Theme Management & Persistence ---
    function getStoredTheme() {
      return localStorage.getItem('antara_theme') || 'dark';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('antara_theme', theme);
      
      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        const icon = toggleBtn.querySelector('.theme-icon');
        if (icon) {
          // If dark, show ☀ to prompt switching to light; if light, show ☾ to prompt dark
          icon.textContent = theme === 'dark' ? '☀' : '☾';
        }
        toggleBtn.setAttribute('title', theme === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme');
        toggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme');
      }
    }

    function initTheme() {
      const initialTheme = getStoredTheme();
      applyTheme(initialTheme);
      
      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          applyTheme(newTheme);
        });
      }
    }

    // --- Initialization ---
    async function init() {
      initTheme();
      try {
        const response = await fetch('festivals_database.json');
        if (!response.ok) throw new Error("Fetch failed");
        allFestivals = await response.json();
        
        buildCalendar();
        initCarousel();
      } catch (err) {
        console.error("Failed to load heritage data:", err);
      }
    }

    // --- Build Left Panel (Grid) ---
    function buildCalendar() {
      const grid = document.getElementById('calendar');
      grid.innerHTML = '';
      
      months.forEach((monthData) => {
        // Find festivals that occur in this month
        const festsInMonth = allFestivals.filter(f => f.all_months && f.all_months.includes(monthData.code));
        
        const node = document.createElement('div');
        node.className = 'month-node';
        node.innerText = monthData.code;
        
        // Mark if festivals exist
        if (festsInMonth.length > 0) {
          const indicator = document.createElement('div');
          indicator.className = 'festival-indicator';
          indicator.innerText = '✦';
          node.appendChild(indicator);
        }
        
        node.addEventListener('click', () => {
          // Highlight active node
          document.querySelectorAll('.month-node').forEach(n => n.classList.remove('active'));
          node.classList.add('active');
          
          handleMonthSelection(monthData, festsInMonth);
        });
        
        grid.appendChild(node);
      });
    }

    // --- Carousel Logic ---
    function initCarousel() {
      const carousel = document.getElementById('carousel');
      
      // Extract all valid images
      const images = allFestivals
        .map(f => f.image_placeholder)
        .filter(src => src && src.trim() !== "");
        
      if (images.length === 0) return;

      images.forEach((src, idx) => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'carousel-img';
        img.onerror = () => { img.style.display = 'none'; }; 
        if (idx === 0) img.classList.add('active');
        carousel.appendChild(img);
      });

      carouselInterval = setInterval(() => {
        const imgs = document.querySelectorAll('.carousel-img');
        if (imgs.length <= 1) return;
        
        imgs[currentCarouselIndex].classList.remove('active');
        currentCarouselIndex = (currentCarouselIndex + 1) % imgs.length;
        imgs[currentCarouselIndex].classList.add('active');
      }, 5000);
    }

    // --- Right Panel Logic ---
    function handleMonthSelection(monthData, festsInMonth) {
      const emptyState = document.getElementById('empty-state');
      const contentLayer = document.getElementById('content-layer');
      
      // Transition out
      contentLayer.classList.remove('visible');
      
      setTimeout(() => {
        emptyState.style.display = 'none';
        contentLayer.style.display = 'block';
        
        if (festsInMonth.length === 0) {
          contentLayer.innerHTML = `
            <div style="text-align:center; padding: 4rem 0;">
              <div style="font-size: 2rem; color: var(--accent-gold); margin-bottom: 1rem;">△</div>
              <h2 style="font-family: var(--font-display); color: var(--text-muted); font-weight: normal;">No cultural events mapped for ${monthData.name}.</h2>
            </div>
          `;
        } else if (festsInMonth.length === 1) {
          renderDetails(festsInMonth[0]);
        } else {
          // Multi-festival month -> group state-wise
          const stateGroups = {};
          festsInMonth.forEach(fest => {
            const state = fest.state || 'Regional Highlights';
            if (!stateGroups[state]) stateGroups[state] = [];
            stateGroups[state].push(fest);
          });

          let pickerHtml = `
            <h2 class="heritage-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">${monthData.name.toUpperCase()} EVENTS</h2>
            <div style="display: flex; align-items: center; gap: 0.8rem; color: var(--accent-gold); margin-bottom: 2rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;">
              <span>❖ Regional Directory</span>
              <span style="opacity: 0.4;">|</span>
              <span>${festsInMonth.length} Events Scheduled</span>
            </div>
            <div class="list-picker">
          `;

          Object.keys(stateGroups).sort().forEach(state => {
            pickerHtml += `
              <div class="state-group">
                <div class="state-group-header">❖ ${state}</div>
            `;
            stateGroups[state].forEach(fest => {
              pickerHtml += `
                <div class="event-card">
                  <div class="event-info">
                    <div class="event-name">${fest.name}</div>
                    <div class="event-meta-tags">
                      <span>◈ ${fest.timing}</span>
                      <span>✦ ${fest.location}</span>
                    </div>
                  </div>
                  <button class="explore-btn" onclick="triggerFestivalLoad('${fest.id}')">
                    Explore ◈
                  </button>
                </div>
              `;
            });
            pickerHtml += `</div>`;
          });

          pickerHtml += `</div>`;
          contentLayer.innerHTML = pickerHtml;
        }
        
        // Transition in
        requestAnimationFrame(() => {
          contentLayer.classList.add('visible');
        });
      }, 400);
    }
    
    // Global hook for inline onclick from the picker
    window.triggerFestivalLoad = function(festId) {
      const contentLayer = document.getElementById('content-layer');
      contentLayer.classList.remove('visible');
      
      setTimeout(() => {
        const fest = allFestivals.find(f => f.id === festId);
        if (fest) renderDetails(fest);
        
        requestAnimationFrame(() => {
          contentLayer.classList.add('visible');
        });
      }, 400);
    };

    function renderDetails(fest) {
      const contentLayer = document.getElementById('content-layer');
      const cuisineFallback = "Traditional regional sweets, ceremonial harvest grains, and indigenous local delicacies.";
      const cuisineContent = fest.cuisine || cuisineFallback;
      
      contentLayer.innerHTML = `
        <div class="festival-hero-img-container">
          <img src="${fest.image_placeholder}" alt="${fest.name}" class="festival-hero-img" onerror="this.style.display='none'; this.parentElement.style.display='none';" />
        </div>
        
        <h1 class="heritage-title">${fest.name}</h1>
        
        <div class="heritage-meta">
          <span class="meta-tag">✦ ${fest.location}</span>
          <span class="meta-tag">◈ ${fest.timing}</span>
          <span class="meta-tag">❖ ${fest.local_language}</span>
        </div>

        <div class="section-title">Historical Overview</div>
        <p class="heritage-text">${fest.history}</p>

        <div class="section-title">Cultural Highlights</div>
        <p class="heritage-text">${fest.culture_and_rituals}</p>

        <div class="section-title">Culinary Heritage</div>
        <p class="heritage-text">${cuisineContent}</p>

        <div class="action-container">
          <a href="https://t.me/AntaraV1bot?start=${fest.id}" target="_blank" rel="noopener noreferrer" class="plan-trip-btn">
            ◈ Plan a trip
          </a>
        </div>
      `;
      
      // Reset scroll position to top
      document.getElementById('heritage-panel').scrollTop = 0;
    }

    // --- Boot ---
    init();

  </script>
</body>
</html>
